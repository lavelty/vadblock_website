        <script>
            if (window.MAINTENANCE_END) {
                var cdEl = document.querySelector('[data-countdown]');
                if (cdEl) {
                    var end = new Date(window.MAINTENANCE_END);
                    var formatted = end.getFullYear() + '/' + (end.getMonth()+1).toString().padStart(2, '0') + '/' + end.getDate().toString().padStart(2, '0') + ' ' + end.getHours().toString().padStart(2, '0') + ':' + end.getMinutes().toString().padStart(2, '0');
                    cdEl.setAttribute('data-countdown', formatted);
                }
            }
        </script>
